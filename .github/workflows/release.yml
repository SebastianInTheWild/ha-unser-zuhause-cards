name: Release

# Hängt die Strategy-Datei an jedes veröffentlichte GitHub-Release an
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datei an Release anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/unser-zuhause-cards.js --clobber
